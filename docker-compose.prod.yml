# =====================================================================
# 통합 운영 배포 (원클릭) — DB + 백엔드 + 관리자 웹 + Caddy(HTTPS 프록시)
#
# 호스트 요구사항: Docker + Docker Compose "만" 있으면 됨.
#   (Python / Node / npm / Postgres 전부 컨테이너 내부에 포함 → 호스트에 불필요)
#
# 사용:
#   1) cp .env.production.example .env.production   (CHANGE_ME 값 교체, DOMAIN 설정)
#   2) docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# 결과 (단일 도메인):
#   https://<DOMAIN>/           → 관리자 웹
#   https://<DOMAIN>/api/v1/... → 백엔드 API
#   https://<DOMAIN>/uploads/.. → 업로드 파일(이미지·동영상, Range 지원)
#   모바일 앱 apiBase = https://<DOMAIN>
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - yosan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALGORITHM: HS256
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    volumes:
      # 업로드 파일 영속화 (컨테이너 재빌드에도 유지)
      - yosan_uploads:/app/uploads
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 26610
      --workers ${UVICORN_WORKERS:-4}
      --proxy-headers
      --forwarded-allow-ips=*

  web-admin:
    build: ./web-admin
    restart: unless-stopped
    depends_on:
      - api

  # 모바일 개발·빌드 도구 컨테이너 (기본 up 에는 뜨지 않음 — profile "mobile")
  # 실제 빌드/OTA 는 EAS(클라우드)에서 수행되며 여기선 CLI·의존성 환경만 제공한다.
  # 사용:
  #   docker compose -f docker-compose.prod.yml --profile mobile build mobile-builder
  #   docker compose -f docker-compose.prod.yml --profile mobile run --rm mobile-builder \
  #       eas update --branch production --platform all --message "..."
  mobile-builder:
    build: ./mobile
    profiles: ["mobile"]
    environment:
      EXPO_TOKEN: ${EXPO_TOKEN:-}
    working_dir: /app
    stdin_open: true
    tty: true
    volumes:
      - ./mobile:/app # 호스트 소스를 라이브로 사용
      - /app/node_modules # 이미지의 node_modules 유지(호스트로 덮이지 않게)

  # (선택) DuckDNS 자동 갱신 — 고정 IP 가 없는 회선에서 무료 호스트명을 현재 공인 IP 로 유지.
  # profile "duckdns". 준비: duckdns.org 에서 서브도메인·토큰 발급 후 .env 에 입력.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    profiles: ["duckdns"]
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      UPDATE_IP: ipv4

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web-admin
    # 호스트 포트. 서버에서 80/443 을 다른 서비스가 이미 쓰면 .env 에서 바꾼다.
    # (예: HTTP_PORT=8080, HTTPS_PORT=8443) — 단, 자동 HTTPS(A방식)는 80/443 필요.
    # Cloudflare 터널(B방식)이면 이 포트들은 외부에서 안 쓰이므로 아무 빈 포트로 둬도 됨.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # 미설정 시 DOMAIN 으로 자동 HTTPS. Cloudflare 터널 뒤: SITE_ADDRESS=:80
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # (선택) Cloudflare Named Tunnel — 공인 IP/포트개방 없이 "고정 주소"로 노출.
  # profile "tunnel" 이라 기본 up 엔 안 뜬다. quick tunnel 과 달리 주소가 고정된다.
  # 준비: Cloudflare Zero Trust 에서 터널 생성 → 토큰 발급, 공개 호스트명(예: api.example.com)을
  #       서비스 http://caddy:80 으로 라우팅 지정. 그리고 SITE_ADDRESS=:80 로 실행.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy

volumes:
  yosan_pgdata:
  yosan_uploads:
  caddy_data:
  caddy_config:
